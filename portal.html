<p style="font-size:13px;color:var(--mu)">নিচে একজন শিক্ষার্থীর শ্রেণি-রোল বদলাতে পারবেন, অথবা পুরো শ্রেণি একসাথে পরবর্তী শ্রেণিতে তুলতে পারবেন।</p>
<label>একজন শিক্ষার্থী</label><select id="pst">${stOpts('')}</select>
<div class="g"><div><label>নতুন শ্রেণি</label><select id="pcl">${CL.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select></div><div><label>নতুন রোল</label><input id="pro" type="number"></div></div>
<button class="b" onclick="promo1()">পরিবর্তন করুন</button><hr>
<label>পুরো শ্রেণি উন্নীত করুন (রোল একই থাকবে)</label>
<select id="pfr">${CL.map((c,i)=>`<option value="${i}">${c} → ${i==5?'উত্তীর্ণ (তালিকা থেকে বাদ)':CL[i+1]}</option>`).join('')}</select>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" id="prk" checked style="width:20px;margin:0"> বার্ষিক পরীক্ষার ফলাফল (মোট নম্বর) অনুযায়ী নতুন রোল দিন</label>
<button class="b" onclick="promoAll()">পুরো শ্রেণি উন্নীত করুন</button> <button class="b" style="background:#7c3aed" onclick="reroll()">শুধু রোল সাজান (একই শ্রেণি)</button>
<p style="font-size:13px;color:var(--am)">⚠ নিয়ম: আগে সর্বোচ্চ শ্রেণি দিয়ে শুরু করুন (পঞ্চম → চতুর্থ → তৃতীয় → ...)। না হলে রোল মিশে যাবে।</p></div>`:''}
<div class="c"><div class="tw"><table><tr><th>রোল</th><th>নাম</th><th>শ্রেণি</th><th>পিতা</th><th>মোবাইল</th></tr>${vis(D.students).sort((a,b)=>a.cls-b.cls||a.roll-b.roll).map(s=>`<tr><td>${bn(s.roll)}</td><td>${e(s.name)}${tag(s)}</td><td>${CL[s.cls]}</td><td>${e(s.fa)}</td><td>${e(s.ph)}</td></tr>`).join('')||'<tr><td colspan=5>কেউ নেই</td></tr>'}</table></div></div>`},
r(){const s=D.students.find(x=>x.id==sel);let h=`<div class="c"><select onchange="sel=this.value;render()">${stOpts(sel)}</select>`;
if(!s)return h+'</div>';
const last=D.marks.filter(m=>m.sid==sel&&m.status=='approved').sort((a,b)=>b.at-a.at)[0],mk=last?last.m:{};
h+=`<b>নম্বর দিন (প্রতি বিষয় ১০০)</b>${SUB.map((b,i)=>`<label>${b}</label><input type="number" min="0" max="100" id="m${i}" value="${mk[b]??''}">`).join('')}<button class="b" onclick="addM()">জমা দিন</button></div>`;
if(!last)return h;const SB=SUB.filter(b=>b in mk),n=Math.max(1,SB.length);let t=0,gp=0,f=0;const rows=SB.map(b=>{const m=+(mk[b]||0),g=gr(m);t+=m;gp+=g[1];if(!g[1])f++;return `<tr><td>${b}</td><td>১০০</td><td>${bn(m)}</td><td>${g[0]}</td><td>${bn(g[1].toFixed(2))}</td></tr>`}).join('');
return h+`<div class="c" id="ms"><div style="text-align:center"><b>${SCHOOL}</b><br>${ADDR}<br><b>মার্কশিট</b></div><p>নাম: ${e(s.name)} | শ্রেণি: ${CL[s.cls]} | রোল: ${bn(s.roll)}<br>পিতা: ${e(s.fa)} | মাতা: ${e(s.mo)}</p><div class="tw"><table><tr><th>বিষয়</th><th>পূর্ণমান</th><th>প্রাপ্ত</th><th>গ্রেড</th><th>পয়েন্ট</th></tr>${rows}<tr><th>মোট</th><th>${bn(100*n)}</th><th>${bn(t)}</th><th>${f?'F':gr(t/n)[0]}</th><th>${bn((f?0:gp/n).toFixed(2))}</th></tr></table></div><p><b>ফলাফল: ${f?'অনুত্তীর্ণ':'উত্তীর্ণ'}</b></p></div><button class="b" onclick="print()">প্রিন্ট</button>`},
f(){const A=ok(D.fees),i=A.filter(x=>x.type=='in').reduce((a,x)=>a+x.amt,0),o=A.filter(x=>x.type=='out').reduce((a,x)=>a+x.amt,0);
return `<div class="c"><b>নতুন এন্ট্রি</b><div class="g"><div><label>তারিখ</label><input id="fd" type="date" value="${TD()}"></div><div><label>ধরন</label><select id="ft"><option value="in">আয় (জমা)</option><option value="out">ব্যয় (খরচ)</option></select></div><div><label>বিবরণ</label><input id="fi"></div><div><label>টাকা</label><input id="fa" type="number"></div></div><button class="b" onclick="addF()">জমা দিন</button></div>
<div class="c"><b>আয়: ${bn(i)} ৳ | ব্যয়: ${bn(o)} ৳ | ব্যালেন্স: ${bn(i-o)} ৳</b><div class="tw"><table><tr><th>তারিখ</th><th>বিবরণ</th><th>আয়</th><th>ব্যয়</th></tr>${vis(D.fees).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${bn(x.date)}</td><td>${e(x.title)}${tag(x)}</td><td>${x.type=='in'?bn(x.amt):''}</td><td>${x.type=='out'?bn(x.amt):''}</td></tr>`).join('')||'<tr><td colspan=4>কোনো এন্ট্রি নেই</td></tr>'}</table></div></div>`},
c(){const s=D.students.find(x=>x.id==sel);let h=`<div class="c"><select onchange="sel=this.value;render()">${stOpts(sel)}</select><select id="ct" onchange="ctv=this.value;render()"><option value="t" ${window.ctv=='t'?'selected':''}>প্রশংসাপত্র</option><option value="x" ${window.ctv=='x'?'selected':''}>ছাড়পত্র</option></select></div>`;
if(!s)return h;const tr=window.ctv=='x';
return h+`<div id="cert"><h2>${SCHOOL}</h2><p style="text-align:center">${ADDR}<br><b>${tr?'ছাড়পত্র':'প্রশংসাপত্র'}</b></p><p style="text-align:right">তারিখ: ${bn(new Date().toLocaleDateString('en-GB'))}</p><p>এই মর্মে প্রত্যয়ন করা যাচ্ছে যে, <b>${e(s.name)}</b>, পিতা: <b>${e(s.fa)}</b>, মাতা: <b>${e(s.mo)}</b>, এই বিদ্যালয়ের <b>${CL[s.cls]}</b> শ্রেণির শিক্ষার্থী ছিল/আছে। রোল: <b>${bn(s.roll)}</b>${s.db?`, জন্ম তারিখ: <b>${bn(String(s.db).split('-').reverse().join('/'))}</b>`:''}। ${tr?'সে বিদ্যালয়ের সকল পাওনা পরিশোধ করে বিদ্যালয় ত্যাগ করছে।':'আমার জানামতে সে রাষ্ট্রবিরোধী বা শৃঙ্খলাবিরোধী কোনো কাজে জড়িত ছিল না।'}</p><p>আমি তার উজ্জ্বল ভবিষ্যৎ কামনা করি।</p><br><br><p style="text-align:right">প্রধান শিক্ষকের স্বাক্ষর</p></div><br><button class="b" onclick="print()">প্রিন্ট</button>`},
a(){const L=pend();return `<div class="c"><b>অনুমোদনের অপেক্ষায় (${bn(L.length)})</b><div class="tw"><table><tr><th>ধরন</th><th>তথ্য</th><th>কে দিয়েছেন</th><th></th></tr>${L.map(x=>{const sn=x.col=='marks'?(D.students.find(s=>s.id==x.sid)||{}).name:'';return `<tr><td>${{students:'শিক্ষার্থী',marks:'নম্বর',fees:'জমা-খরচ',att:'হাজিরা'}[x.col]}</td><td>${x.col=='att'?'হাজিরা — '+CL[x.cls]+', '+bn(x.date)+', অনুপস্থিত '+bn(Object.values(x.a).filter(v=>!v).length)+' জন':x.col=='students'?e(x.name)+', '+CL[x.cls]:x.col=='marks'?e(sn)+' — মোট '+bn(Object.values(x.m).reduce((a,b)=>a+b,0)):e(x.title)+' '+bn(x.amt)+' ৳ ('+(x.type=='in'?'আয়':'ব্যয়')+')'}</td><td>${e(x.by)}</td><td><button class="b s" onclick="dec('${x.col}','${x.id}',1)">অনুমোদন</button> <button class="b r s" onclick="dec('${x.col}','${x.id}',0)">বাতিল</button></td></tr>`}).join('')||'<tr><td colspan=4>কিছু নেই</td></tr>'}</table></div></div>`}};
function render(){const a=$('#app');
if(!U){a.innerHTML=`<div class="c lg"><h3 style="text-align:center;margin-top:0">${SCHOOL}</h3><label>ইমেইল</label><input id="em" type="email"><label>পাসওয়ার্ড</label><input id="pw" type="password"><button class="b" style="width:100%" onclick="login()">লগইন</button><p class="er">${e(err)}</p><p style="text-align:center"><a href="#" onclick="forgot();return false">পাসওয়ার্ড ভুলে গেছেন?</a></p></div>`;return}
if(!TABS().some(t=>t[0]==tab))tab='s';
a.innerHTML=`<header><div style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="width:40px;height:40px;border-radius:50%;background:#fff"><span><b><a href="index.html" style="color:#fff;text-decoration:none">${SCHOOL}</a></b><small>${e(U.email)} — ${admin?'প্রধান শিক্ষক/অ্যাডমিন':'শিক্ষক'}</small></span></div><div><button class="b o s" onclick="pwr()">পাসওয়ার্ড বদল</button> <button class="b o s" onclick="out()">বের হন</button></div></header><nav>${TABS().map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';err='';render()">${t[1]}</button>`).join('')}</nav><main>${err?`<div class="c">${e(err)}</div>`:''}${V[tab]()}</main>`;fitReg()}
window.render=render;window.print=()=>window.top.print();
window.login=()=>{signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(()=>{err='ইমেইল বা পাসওয়ার্ড ভুল।';render()})};
window.forgot=()=>{const m=$('#em').value.trim();if(!m){err='উপরে ইমেইল লিখে আবার চাপুন।';render();return}sendPasswordResetEmail(auth,m).then(()=>{err='রিসেট লিংক ইমেইলে পাঠানো হয়েছে।';render()}).catch(()=>{err='পাঠানো যায়নি।';render()})};
window.pwr=()=>sendPasswordResetEmail(auth,U.email).then(()=>{err='নতুন পাসওয়ার্ড দেওয়ার লিংক আপনার ইমেইলে পাঠানো হয়েছে।';render()});
window.out=()=>signOut(auth);
window.addS=()=>{const n=$('#n').value.trim();const cls=+$('#cl').value,roll=+$('#ro').value;if(!n){err='নাম লিখুন';render();return}if(!roll){err='রোল নম্বর দিন।';render();return}if(D.students.some(z=>z.status!='passed'&&z.cls==cls&&z.roll==roll)){err='ওই শ্রেণিতে এই রোল আগে থেকেই আছে।';render();return}add('students',{name:n,fa:$('#fa').value,mo:$('#mo').value,ph:$('#ph').value,cls,roll,db:$('#db').value})};
window.addM=()=>{const m={};SUB.forEach((b,i)=>{const v=$('#m'+i).value.trim();if(v!=='')m[b]=Math.max(0,Math.min(100,+v||0))});if(!Object.keys(m).length){err='অন্তত একটি বিষয়ের নম্বর দিন।';render();return}if(Object.keys(m).length<SUB.length&&!confirm('কিছু বিষয়ের নম্বর ফাঁকা আছে, সেগুলো বাদ দিয়ে হিসাব হবে। জমা দিবেন?'))return;add('marks',{sid:sel,m})};
window.addA=()=>{const k0=window.hd||TD();if(attRec(window.hc,k0.slice(0,7))[k0]&&!confirm('এই তারিখের হাজিরা আগেই জমা হয়েছে। আবার জমা দিলে নতুনটি কার্যকর হবে। জমা দিবেন?'))return;const a={};document.querySelectorAll('.pk').forEach(c=>a[c.dataset.id]=c.checked);add('att',{date:window.hd||TD(),cls:window.hc,a})};
window.addF=()=>{const a=+$('#fa').value;if(!a){err='টাকার পরিমাণ লিখুন';render();return}add('fees',{date:$('#fd').value,type:$('#ft').value,title:$('#fi').value,amt:a})};

const acd=x=>({name:x.name||'',fa:x.fa||'',mo:x.mo||'',cls:x.cls,roll:x.roll,status:'approved'});
async function mv(x,cls,roll){await updateDoc(doc(db,'students',x.id),{cls,roll});await deleteDoc(doc(db,'admitcards',x.cls+'_'+x.roll)).catch(()=>{});await setDoc(doc(db,'admitcards',cls+'_'+roll),acd({...x,cls,roll}))}
window.promo1=async()=>{const id=$('#pst').value,cls=+$('#pcl').value,roll=+$('#pro').value;const x=D.students.find(z=>z.id==id);if(!x||!roll){err='শিক্ষার্থী বাছাই করুন ও নতুন রোল দিন।';render();return}
if(ok(D.students).some(z=>z.id!=id&&z.cls==cls&&z.roll==roll)){err='ওই শ্রেণিতে এই রোল আগে থেকেই আছে।';render();return}
try{await mv(x,cls,roll);err=x.name+' এখন '+CL[cls]+' শ্রেণি, রোল '+bn(roll);}catch(c){err='ত্রুটি: '+c.code}render()};
const lastM=sid=>D.marks.filter(m=>m.sid==sid&&m.status=='approved').sort((a,b)=>b.at-a.at)[0];
const tot=x=>{const m=lastM(x.id);return m?Object.values(m.m).reduce((a,b)=>a+b,0):-1};
const fl=x=>{const m=lastM(x.id);return m?Object.values(m.m).some(v=>v<33):false};
const rank=L=>[...L].sort((a,b)=>(fl(a)-fl(b))||(tot(b)-tot(a))||(a.roll-b.roll));
async function bulk(L,cls,rolls){for(const x of L)await deleteDoc(doc(db,'admitcards',x.cls+'_'+x.roll)).catch(()=>{});
for(const x of L)await updateDoc(doc(db,'students',x.id),{cls,roll:rolls[x.id]});
for(const x of L)await setDoc(doc(db,'admitcards',cls+'_'+rolls[x.id]),acd({...x,cls,roll:rolls[x.id]}))}
const mkRolls=(L,byRank)=>{const r={};(byRank?rank(L):[...L].sort((a,b)=>a.roll-b.roll)).forEach((x,i)=>r[x.id]=byRank?i+1:x.roll);return r};
window.promoAll=async()=>{const f=+$('#pfr').value,rk=$('#prk').checked,L=ok(D.students).filter(z=>z.cls==f);if(!L.length){err='এই শ্রেণিতে কেউ নেই।';render();return}
if(f<5&&ok(D.students).some(z=>z.cls==f+1)){err=CL[f+1]+' শ্রেণিতে এখনো শিক্ষার্থী আছে। আগে ওই শ্রেণি উন্নীত করুন।';render();return}
if(!confirm(bn(L.length)+' জনকে '+(f==5?'উত্তীর্ণ (বের) করবেন?':CL[f+1]+' শ্রেণিতে তুলবেন'+(rk?' (ফলাফল অনুযায়ী নতুন রোল সহ)':'')+'?')))return;
try{if(f==5){for(const x of L){await updateDoc(doc(db,'students',x.id),{status:'passed'});await deleteDoc(doc(db,'admitcards',x.cls+'_'+x.roll)).catch(()=>{})}}else await bulk(L,f+1,mkRolls(L,rk));err='সম্পন্ন: '+bn(L.length)+' জন।'}catch(c){err='ত্রুটি: '+c.code}render()};
window.reroll=async()=>{const f=+$('#pfr').value,L=ok(D.students).filter(z=>z.cls==f);if(!L.length){err='এই শ্রেণিতে কেউ নেই।';render();return}
const R=mkRolls(L,true);if(!confirm(CL[f]+' শ্রেণির '+bn(L.length)+' জনের রোল ফলাফল অনুযায়ী নতুন করে সাজানো হবে। নিশ্চিত?'))return;
try{await bulk(L,f,R);err='রোল নতুন করে সাজানো হয়েছে।'}catch(c){err='ত্রুটি: '+c.code}render()};
window.dec=(c,id,y)=>(y?updateDoc(doc(db,c,id),{status:'approved'}):deleteDoc(doc(db,c,id))).catch(x=>{err='ত্রুটি: '+x.code;render()});
window.sel='';Object.defineProperty(window,'sel',{get:()=>sel,set:v=>sel=v});Object.defineProperty(window,'tab',{get:()=>tab,set:v=>tab=v});
document.addEventListener('change',ev=>{if(ev.target.id=='ct'){window.ctv=ev.target.value}});window.ctv='t';window.hc=1;window.hd='';
onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];U=u;admin=false;err='';
if(u){try{const d=await getDoc(doc(db,'users',u.uid));admin=d.exists()&&String(d.data().role||'').toLowerCase()=='admin'}catch(x){}
['students','marks','fees','att'].forEach(c=>unsub.push(onSnapshot(collection(db,c),s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(!/INPUT|SELECT/.test(document.activeElement.tagName))render()},x=>{err='তথ্য আনা যায়নি: '+x.code;render()})))}
render()});
</script></body></html>
