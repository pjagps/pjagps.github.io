<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>স্কুল পোর্টাল</title>
<style>
:root{--bg:#f4f6f8;--cd:#fff;--tx:#1d2733;--mu:#667;--pr:#15803d;--bd:#d9dee3;--rd:#b91c1c;--am:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#12171c;--cd:#1b222a;--tx:#e8edf2;--mu:#9aa6b2;--pr:#4ade80;--bd:#2d3742;--rd:#f87171;--am:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px "Noto Sans Bengali",Kalpurush,system-ui,sans-serif}
header{background:#15803d;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px}header small{display:block;opacity:.9;font-size:12px}
nav{display:flex;overflow-x:auto;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--mu);padding:12px 14px;font:inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--pr);border-color:var(--pr);font-weight:700}
main{padding:12px;max-width:900px;margin:auto}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 8px}
label{font-size:13px;color:var(--mu)}
.b{background:var(--pr);color:#fff;border:0;padding:9px 14px;border-radius:8px;font:inherit}
@media (prefers-color-scheme:dark){.b{color:#000}}
.b.r{background:var(--rd)}.b.s{padding:4px 9px;font-size:13px}.b.o{background:none;border:1px solid #fff;color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}th{background:var(--bg)}
.p{color:var(--am);font-size:12px}.lg{max-width:380px;margin:60px auto}.er{color:var(--rd);font-size:14px}
#cert{background:#fff;color:#000;border:3px double #15803d;padding:22px;line-height:1.9;margin-top:10px}#cert h2{text-align:center;margin:0}
@media print{body *{visibility:hidden}#cert,#cert *,#ms,#ms *{visibility:visible}#cert,#ms{position:absolute;left:0;top:0;width:100%;background:#fff;color:#000}}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.k{border-radius:10px;padding:14px;color:#fff;font-size:13px}.k b{display:block;font-size:22px;margin-bottom:2px}
.bar{height:12px;background:var(--pr);border-radius:4px;margin-top:3px}@media(min-width:700px){.kg{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div>
<script type="module">

const stOpts=v=>'<option value="">-- শিক্ষার্থী বাছাই --</option>'+ok(D.students).sort((a,b)=>a.cls-b.cls||a.roll-b.roll).map(s=>`<option value="${s.id}" ${s.id==v?'selected':''}>${e(s.name)} (${CL[s.cls]}, রোল ${bn(s.roll)})</option>`).join('');
const TD=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const V={
d(){const S=ok(D.students),td=TD(),A=ok(D.fees),i=A.filter(x=>x.type=='in').reduce((a,x)=>a+x.amt,0),o=A.filter(x=>x.type=='out').reduce((a,x)=>a+x.amt,0);
const day=CL.map((_,k)=>ok(D.att).filter(x=>x.date==td&&x.cls==k).sort((a,b)=>b.at-a.at)[0]);let P=0,Ab=0;day.forEach(x=>{if(x)Object.values(x.a).forEach(v=>v?P++:Ab++)});
const k=(c,n,t)=>`<div class="k" style="background:${c}"><b>${n}</b>${t}</div>`,mx=Math.max(1,...CL.map((_,j)=>S.filter(s=>s.cls==j).length));
return `<div class="kg">${k('#2563eb',bn(S.length),'মোট শিক্ষার্থী')}${k('#15803d',bn(P),'আজ উপস্থিত')}${k('#dc2626',bn(Ab),'আজ অনুপস্থিত')}${k('#7c3aed',bn(i)+' ৳','মোট আয়')}${k('#ea580c',bn(o)+' ৳','মোট ব্যয়')}${k('#0891b2',bn(i-o)+' ৳','ব্যালেন্স')}</div>`+(admin?`<div class="c">অনুমোদনের অপেক্ষায়: <b>${bn(pend().length)}</b> টি</div>`:'')+`<div class="c"><b>শ্রেণিভিত্তিক শিক্ষার্থী ও আজকের উপস্থিতি</b>${CL.map((c,j)=>{const n=S.filter(s=>s.cls==j).length,x=day[j],p=x?Object.values(x.a).filter(v=>v).length:0;return `<div style="margin-top:8px">${c} — ${bn(n)} জন${x?` (উপস্থিত ${bn(p)})`:' (হাজিরা নেওয়া হয়নি)'}<div class="bar" style="width:${n/mx*100}%"></div></div>`}).join('')}</div>`},
h(){const cls=window.hc,dt=window.hd||TD(),L=ok(D.students).filter(s=>s.cls==cls).sort((a,b)=>a.roll-b.roll),rec=ok(D.att).filter(x=>x.cls==cls&&x.date.startsWith(dt.slice(0,7)));
return `<div class="c"><b>হাজিরা নিন</b><div class="g"><div><label>শ্রেণি</label><select onchange="hc=+this.value;render()">${CL.map((c,i)=>`<option value="${i}" ${i==cls?'selected':''}>${c}</option>`)}</select></div><div><label>তারিখ</label><input type="date" value="${dt}" onchange="hd=this.value;render()"></div></div>${L.map(s=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin:6px 0;font-size:15px"><input type="checkbox" class="pk" data-id="${s.id}" checked style="width:20px;margin:0"> ${bn(s.roll)}. ${e(s.name)}</label>`).join('')||'<p>এই শ্রেণিতে অনুমোদিত শিক্ষার্থী নেই</p>'}${L.length?'<p><small>টিক = উপস্থিত। অনুপস্থিতের টিক তুলে দিন।</small></p><button class="b" onclick="addA()">জমা দিন</button>':''}</div>
<div class="c"><b>এই মাসের হাজিরা (অনুমোদিত)</b> — কার্যদিবস: ${bn(rec.length)}<div class="tw"><table><tr><th>রোল</th><th>নাম</th><th>উপস্থিত</th><th>অনুপস্থিত</th></tr>${L.map(s=>`<tr><td>${bn(s.roll)}</td><td>${e(s.name)}</td><td>${bn(rec.filter(x=>x.a[s.id]===true).length)}</td><td>${bn(rec.filter(x=>x.a[s.id]===false).length)}</td></tr>`).join('')}</table></div></div>`},
s(){return `<div class="c"><b>নতুন শিক্ষার্থী</b><div class="g"><div><label>নাম</label><input id="n"></div><div><label>পিতার নাম</label><input id="fa"></div><div><label>মাতার নাম</label><input id="mo"></div><div><label>মোবাইল</label><input id="ph"></div><div><label>শ্রেণি</label><select id="cl">${CL.map((c,i)=>`<option value="${i}" ${i==1?'selected':''}>${c}</option>`)}</select></div><div><label>রোল</label><input id="ro" type="number"></div></div><label>জন্ম তারিখ</label><input id="db" type="date"><button class="b" onclick="addS()">জমা দিন</button></div>${admin?`<div class="c"><b>🎓 শ্রেণি উন্নীত / পরিবর্তন (শুধু অ্যাডমিন)</b>
<p style="font-size:13px;color:var(--mu)">নিচে একজন শিক্ষার্থীর শ্রেণি-রোল বদলাতে পারবেন, অথবা পুরো শ্রেণি একসাথে পরবর্তী শ্রেণিতে তুলতে পারবেন।</p>
<label>একজন শিক্ষার্থী</label><select id="pst">${stOpts('')}</select>
<div class="g"><div><label>নতুন শ্রেণি</label><select id="pcl">${CL.map((c,i)=>`<option value="${i}">${c}</option>`)}</select></div><div><label>নতুন রোল</label><input id="pro" type="number"></div></div>
<button class="b" onclick="promo1()">পরিবর্তন করুন</button><hr>
<label>পুরো শ্রেণি উন্নীত করুন (রোল একই থাকবে)</label>
<select id="pfr">${CL.map((c,i)=>`<option value="${i}">${c} → ${i==5?'উত্তীর্ণ (তালিকা থেকে বাদ)':CL[i+1]}</option>`)}</select>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" id="prk" checked style="width:20px;margin:0"> বার্ষিক পরীক্ষার ফলাফল (মোট নম্বর) অনুযায়ী নতুন রোল দিন</label>
<button class="b" onclick="promoAll()">পুরো শ্রেণি উন্নীত করুন</button> <button class="b" style="background:#7c3aed" onclick="reroll()">শুধু রোল সাজান (একই শ্রেণি)</button>
<p style="font-size:13px;color:var(--am)">⚠ নিয়ম: আগে সর্বোচ্চ শ্রেণি দিয়ে শুরু করুন (পঞ্চম → চতুর্থ → তৃতীয় → ...)। না হলে রোল মিশে যাবে।</p></div>`:''}
<div class="c"><div class="tw"><table><tr><th>রোল</th><th>নাম</th><th>শ্রেণি</th><th>পিতা</th><th>মোবাইল</th></tr>${vis(D.students).sort((a,b)=>a.cls-b.cls||a.roll-b.roll).map(s=>`<tr><td>${bn(s.roll)}</td><td>${e(s.name)}${tag(s)}</td><td>${CL[s.cls]}</td><td>${e(s.fa)}</td><td>${e(s.ph)}</td></tr>`).join('')||'<tr><td colspan=5>কেউ নেই</td></tr>'}</table></div></div>`},
r(){const s=D.students.find(x=>x.id==sel);let h=`<div class="c"><select onchange="sel=this.value;render()">${stOpts(sel)}</select>`;
if(!s)return h+'</div>';

h+=`<b>নম্বর দিন (প্রতি বিষয় ১০০)</b>${SUB.map((b,i)=>`<label>${b}</label><input type="number" min="0" max="100" id="m${i}" value="${mk[b]??''}">`).join('')}<button class="b" onclick="addM()">জমা দিন</button></div>`;
if(!last)return h;let t=0,gp=0,f=0;const rows=SUB.map(b=>{const m=+(mk[b]||0),g=gr(m);t+=m;gp+=g[1];if(!g[1])f++;return `<tr><td>${b}</td><td>১০০</td><td>${bn(m)}</td><td>${g[0]}</td><td>${bn(g[1].toFixed(2))}</td></tr>`}).join('');
return h+`<div class="c" id="ms"><div style="text-align:center"><b>${SCHOOL}</b><br>${ADDR}<br><b>মার্কশিট</b></div><p>নাম: ${e(s.name)} | শ্রেণি: ${CL[s.cls]} | রোল: ${bn(s.roll)}<br>পিতা: ${e(s.fa)} | মাতা: ${e(s.mo)}</p><div class="tw"><table><tr><th>বিষয়</th><th>পূর্ণমান</th><th>প্রাপ্ত</th><th>গ্রেড</th><th>পয়েন্ট</th></tr>${rows}<tr><th>মোট</th><th>${bn(600)}</th><th>${bn(t)}</th><th>${f?'F':gr(t/6)[0]}</th><th>${bn((f?0:gp/6).toFixed(2))}</th></tr></table></div><p><b>ফলাফল: ${f?'অনুত্তীর্ণ':'উত্তীর্ণ'}</b></p></div><button class="b" onclick="print()">প্রিন্ট</button>`},
f(){const A=ok(D.fees),i=A.filter(x=>x.type=='in').reduce((a,x)=>a+x.amt,0),o=A.filter(x=>x.type=='out').reduce((a,x)=>a+x.amt,0);

<div class="c"><b>আয়: ${bn(i)} ৳ | ব্যয়: ${bn(o)} ৳ | ব্যালেন্স: ${bn(i-o)} ৳</b><div class="tw"><table><tr><th>তারিখ</th><th>বিবরণ</th><th>আয়</th><th>ব্যয়</th></tr>${vis(D.fees).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${bn(x.date)}</td><td>${e(x.title)}${tag(x)}</td><td>${x.type=='in'?bn(x.amt):''}</td><td>${x.type=='out'?bn(x.amt):''}</td></tr>`).join('')||'<tr><td colspan=4>কোনো এন্ট্রি নেই</td></tr>'}</table></div></div>`},
c(){const s=D.students.find(x=>x.id==sel);let h=`<div class="c"><select onchange="sel=this.value;render()">${stOpts(sel)}</select><select id="ct" onchange="render()"><option value="t" ${window.ctv=='t'?'selected':''}>প্রশংসাপত্র</option><option value="x" ${window.ctv=='x'?'selected':''}>ছাড়পত্র</option></select></div>`;
if(!s)return h;const tr=window.ctv=='x';
return h+`<div id="cert"><h2>${SCHOOL}</h2><p style="text-align:center">${ADDR}<br><b>${tr?'ছাড়পত্র':'প্রশংসাপত্র'}</b></p><p style="text-align:right">তারিখ: ${bn(new Date().toLocaleDateString('en-GB'))}</p><p>এই মর্মে প্রত্যয়ন করা যাচ্ছে যে, <b>${e(s.name)}</b>, পিতা: <b>${e(s.fa)}</b>, মাতা: <b>${e(s.mo)}</b>, এই বিদ্যালয়ের <b>${CL[s.cls]}</b> শ্রেণির শিক্ষার্থী ছিল/আছে। রোল: <b>${bn(s.roll)}</b>${s.db?`, জন্ম তারিখ: <b>${bn(s.db)}</b>`:''}। ${tr?'সে বিদ্যালয়ের সকল পাওনা পরিশোধ করে বিদ্যালয় ত্যাগ করছে।':'আমার জানামতে সে রাষ্ট্রবিরোধী বা শৃঙ্খলাবিরোধী কোনো কাজে জড়িত ছিল না।'}</p><p>আমি তার উজ্জ্বল ভবিষ্যৎ কামনা করি।</p><br><br><p style="text-align:right">প্রধান শিক্ষকের স্বাক্ষর</p></div><br><button class="b" onclick="print()">প্রিন্ট</button>`},
a(){const L=pend();return `<div class="c"><b>অনুমোদনের অপেক্ষায় (${bn(L.length)})</b><div class="tw"><table><tr><th>ধরন</th><th>তথ্য</th><th>কে দিয়েছেন</th><th></th></tr>${L.map(x=>{const sn=x.col=='marks'?(D.students.find(s=>s.id==x.sid)||{}).name:'';return `<tr><td>${{students:'শিক্ষার্থী',marks:'নম্বর',fees:'জমা-খরচ',att:'হাজিরা'}[x.col]}</td><td>${x.col=='att'?'হাজিরা — '+CL[x.cls]+', '+bn(x.date)+', অনুপস্থিত '+bn(Object.values(x.a).filter(v=>!v).length)+' জন':x.col=='students'?e(x.name)+', '+CL[x.cls]:x.col=='marks'?e(sn)+' — মোট '+bn(Object.values(x.m).reduce((a,b)=>a+b,0)):e(x.title)+' '+bn(x.amt)+' ৳ ('+(x.type=='in'?'আয়':'ব্যয়')+')'}</td><td>${e(x.by)}</td><td><button class="b s" onclick="dec('${x.col}','${x.id}',1)">অনুমোদন</button> <button class="b r s" onclick="dec('${x.col}','${x.id}',0)">বাতিল</button></td></tr>`}).join('')||'<tr><td colspan=4>কিছু নেই</td></tr>'}</table></div></div>`}};
function render(){const a=$('#app');
if(!U){a.innerHTML=`<div class="c lg"><h3 style="text-align:center;margin-top:0">${SCHOOL}</h3><label>ইমেইল</label><input id="em" type="email"><label>পাসওয়ার্ড</label><input id="pw" type="password"><button class="b" style="width:100%" onclick="login()">লগইন</button><p class="er">${e(err)}</p><p style="text-align:center"><a href="#" onclick="forgot();return false">পাসওয়ার্ড ভুলে গেছেন?</a></p></div>`;return}
if(!TABS().some(t=>t[0]==tab))tab='s';
a.innerHTML=`<header><div style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="" style="width:40px;height:40px;border-radius:50%;background:#fff"><span><b><a href="index.html" style="color:#fff;text-decoration:none">${SCHOOL}</a></b><small>${e(U.email)} — ${admin?'প্রধান শিক্ষক/অ্যাডমিন':'শিক্ষক'}</small></span></div><div><button class="b o s" onclick="pwr()">পাসওয়ার্ড বদল</button> <button class="b o s" onclick="out()">বের হন</button></div></header><nav>${TABS().map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';err='';render()">${t[1]}</button>`).join('')}</nav><main>${err?`<div class="c">${e(err)}</div>`:''}${V[tab]()}</main>`}
window.render=render;window.print=()=>window.top.print();
window.login=()=>{signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(()=>{err='ইমেইল বা পাসওয়ার্ড ভুল।';render()})};
window.forgot=()=>{const m=$('#em').value.trim();if(!m){err='উপরে ইমেইল লিখে আবার চাপুন।';render();return}sendPasswordResetEmail(auth,m).then(()=>{err='রিসেট লিংক ইমেইলে পাঠানো হয়েছে।';render()}).catch(()=>{err='পাঠানো যায়নি।';render()})};
window.pwr=()=>sendPasswordResetEmail(auth,U.email).then(()=>{err='নতুন পাসওয়ার্ড দেওয়ার লিংক আপনার ইমেইলে পাঠানো হয়েছে।';render()});
window.out=()=>signOut(auth);
window.addS=()=>{const n=$('#n').value.trim();if(!n){err='নাম লিখুন';render();return}add('students',{name:n,fa:$('#fa').value,mo:$('#mo').value,ph:$('#ph').value,cls:+$('#cl').value,roll:+$('#ro').value||0,db:$('#db').value})};
window.addM=()=>add('marks',{sid:sel,m:Object.fromEntries(SUB.map((b,i)=>[b,Math.min(100,+$('#m'+i).value||0)]))});
window.addA=()=>{const a={};document.querySelectorAll('.pk').forEach(c=>a[c.dataset.id]=c.checked);add('att',{date:window.hd||TD(),cls:window.hc,a})};
window.addF=()=>{const a=+$('#fa').value;if(!a){err='টাকার পরিমাণ লিখুন';render();return}add('fees',{date:$('#fd').value,type:$('#ft').value,title:$('#fi').value,amt:a})};

const acd=x=>({name:x.name||'',fa:x.fa||'',mo:x.mo||'',cls:x.cls,roll:x.roll,status:'approved'});
async function mv(x,cls,roll){await updateDoc(doc(db,'students',x.id),{cls,roll});await deleteDoc(doc(db,'admitcards',x.cls+'_'+x.roll)).catch(()=>{});await setDoc(doc(db,'admitcards',cls+'_'+roll),acd({...x,cls,roll}))}
window.promo1=async()=>{const id=$('#pst').value,cls=+$('#pcl').value,roll=+$('#pro').value;const x=D.students.find(z=>z.id==id);if(!x||!roll){err='শিক্ষার্থী বাছাই করুন ও নতুন রোল দিন।';render();return}
if(ok(D.students).some(z=>z.id!=id&&z.cls==cls&&z.roll==roll)){err='ওই শ্রেণিতে এই রোল আগে থেকেই আছে।';render();return}
try{await mv(x,cls,roll);err=x.name+' এখন '+CL[cls]+' শ্রেণি, রোল '+bn(roll);}catch(c){err='ত্রুটি: '+c.code}render()};
const lastM=sid=>D.marks.filter(m=>m.sid==sid&&m.status=='approved').sort((a,b)=>b.at-a.at)[0];
const tot=x=>{const m=lastM(x.id);return m?Object.values(m.m).reduce((a,b)=>a+b,0):-1};
const fl=x=>{const m=lastM(x.id);return m?Object.values(m.m).some(v=>v<33):false};
const rank=L=>[...L].sort((a,b)=>(fl(a)-fl(b))||(tot(b)-tot(a))||(a.roll-b.roll));
async function bulk(L,cls,rolls){for(const x of L)await deleteDoc(doc(db,'admitcards',x.cls+'_'+x.roll)).catch(()=>{});
for(const x of L)await updateDoc(doc(db,'students',x.id),{cls,roll:rolls[x.id]});
for(const x of L)await setDoc(doc(db,'admitcards',cls+'_'+rolls[x.id]),acd({...x,cls,roll:rolls[x.id]}))}
const mkRolls=(L,byRank)=>{const r={};(byRank?rank(L):[...L].sort((a,b)=>a.roll-b.roll)).forEach((x,i)=>r[x.id]=byRank?i+1:x.roll);return r};
window.promoAll=async()=>{const f=+$('#pfr').value,rk=$('#prk').checked,L=ok(D.students).filter(z=>z.cls==f);if(!L.length){err='এই শ্রেণিতে কেউ নেই।';render();return}
if(f<5&&ok(D.students).some(z=>z.cls==f+1)){err=CL[f+1]+' শ্রেণিতে এখনো শিক্ষার্থী আছে। আগে ওই শ্রেণি উন্নীত করুন।';render();return}
if(!confirm(bn(L.length)+' জনকে '+(f==5?'উত্তীর্ণ (বের) করবেন?':CL[f+1]+' শ্রেণিতে তুলবেন'+(rk?' (ফলাফল অনুযায়ী নতুন রোল সহ)':'')+'?')))return;
try{if(f==5){for(const x of L){await updateDoc(doc(db,'students',x.id),{status:'passed'});await deleteDoc(doc(db,'admitcards',x.cls+'_'+x.roll)).catch(()=>{})}}else await bulk(L,f+1,mkRolls(L,rk));err='সম্পন্ন: '+bn(L.length)+' জন।'}catch(c){err='ত্রুটি: '+c.code}render()};
window.reroll=async()=>{const f=+$('#pfr').value,L=ok(D.students).filter(z=>z.cls==f);if(!L.length){err='এই শ্রেণিতে কেউ নেই।';render();return}
const R=mkRolls(L,true);if(!confirm(CL[f]+' শ্রেণির '+bn(L.length)+' জনের রোল ফলাফল অনুযায়ী নতুন করে সাজানো হবে। নিশ্চিত?'))return;
try{await bulk(L,f,R);err='রোল নতুন করে সাজানো হয়েছে।'}catch(c){err='ত্রুটি: '+c.code}render()};
window.dec=(c,id,y)=>(y?updateDoc(doc(db,c,id),{status:'approved'}):deleteDoc(doc(db,c,id))).catch(x=>{err='ত্রুটি: '+x.code;render()});
window.sel='';Object.defineProperty(window,'sel',{get:()=>sel,set:v=>sel=v});Object.defineProperty(window,'tab',{get:()=>tab,set:v=>tab=v});
document.addEventListener('change',ev=>{if(ev.target.id=='ct'){window.ctv=ev.target.value}});window.ctv='t';window.hc=1;window.hd='';
onAuthStateChanged(auth,async u=>{unsub.forEach(f=>f());unsub=[];U=u;admin=false;err='';
if(u){try{const d=await getDoc(doc(db,'users',u.uid));admin=d.exists()&&String(d.data().role||'').toLowerCase()=='admin'}catch(x){}
['students','marks','fees','att'].forEach(c=>unsub.push(onSnapshot(collection(db,c),s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(!/INPUT|SELECT/.test(document.activeElement.tagName))render()},x=>{err='তথ্য আনা যায়নি: '+x.code;render()})))}
render()});
</script></body></html>
