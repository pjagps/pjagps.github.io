const IL=[['🏫 প্রতিষ্ঠান সম্পর্কিত',[['about','প্রতিষ্ঠান সম্পর্কে'],['committee','পরিচালনা পর্ষদ'],['land','ভূমির তথ্য'],['building','ভবন এবং কক্ষ সংখ্যা'],['map','ক্যাম্পাস ম্যাপ'],['academic','প্রাতিষ্ঠানিক যোগ্যতা']]],['📚 শিক্ষা সম্পর্কিত',[['routine','ক্লাস রুটিন'],['syllabus','সিলেবাস'],['exam','পরীক্ষার রুটিন'],['result','আভ্যন্তরীণ পরীক্ষার ফলাফল']]]];
const PHS=()=>[...PH].sort((a,b)=>a.at-b.at),isNew=n=>Date.now()-new Date(n.date)<7*864e5;
const hs=()=>{const f=PHS()[0];return f?` style="background:linear-gradient(rgba(20,83,45,.8),rgba(20,83,45,.8)),url('${f.d}') center/cover"`:''};
function gal(){const L=PHS();if(!L.length&&!admin)return '';if(si>=L.length)si=0;
return `<div class="c"><h2>প্রতিষ্ঠানের ছবিঘর</h2>${L.length?`<img id="gm" src="${L[si].d}" style="width:100%;border-radius:8px;max-height:420px;object-fit:cover"><div style="display:flex;gap:6px;overflow-x:auto;margin-top:8px">${L.map((p,i)=>`<img src="${p.d}" onclick="setSi(${i})" style="height:56px;border-radius:6px;border:2px solid ${i==si?'var(--pr)':'transparent'}">`).join('')}</div>${admin?`<p><button class="b r" onclick="del('photos','${L[si].id}')">এই ছবি মুছুন</button></p>`:''}`:'<p>এখনো কোনো ছবি যোগ করা হয়নি।</p>'}${admin?`<hr><label>ছবি যোগ করুন (অ্যাডমিন)</label><input type="file" id="ph" accept="image/*" onchange="upPhoto(this)">`:''}</div>`}
function home(){const L=[...N].sort((a,b)=>b.date.localeCompare(a.date)),col=['#2563eb','#15803d','#dc2626','#7c3aed','#ea580c','#0891b2','#be185d'];
const Q=[['admission','📝 অনলাইন ভর্তি'],['teachers','👥 শিক্ষক তালিকা'],['students','📋 ছাত্র-ছাত্রীর তালিকা'],['notices','📢 নোটিশ'],['result','🏅 ফলাফল'],['admit','🪪 এডমিট কার্ড'],['exam','🗓️ পরীক্ষার রুটিন']];
return (L[0]?`<div class="tk">📢 সর্বশেষ নোটিশ: <a href="#notices">${e(L[0].title)}</a></div>`:'')+`<div class="q">${Q.map((x,i)=>`<a href="#${x[0]}" style="background:${col[i]}">${x[1]}</a>`).join('')}</div>
${gal()}<div class="c"><h2>নোটিশ বোর্ড</h2>${L.slice(0,6).map(n=>`<div class="nb">${bn(n.date)} — <a href="#notices">${e(n.title)}</a>${isNew(n)?' <span class="nw">NEW</span>':''}</div>`).join('')||'কোনো নোটিশ নেই'}<p style="text-align:right"><a class="b" style="text-decoration:none" href="#notices">সকল</a></p></div>
${['hm','ueo','auo'].map(k=>`<div class="c"><h2>${LBL[k]}</h2><pre>${e((P[k]?.body||'তথ্য শিগগিরই যোগ করা হবে।').slice(0,220))}</pre><p><a href="#${k}">বিস্তারিত</a></p></div>`).join('')}
<div class="c"><h2>প্রতিষ্ঠান সম্পর্কে</h2><pre>${e((P.about?.body||DEF.about).slice(0,400))}</pre><p><a href="#about">বিস্তারিত</a></p></div>
${more()}`}
function page(k){
if(k=='notices')return `<div class="c"><h2>বিদ্যালয় নোটিশ</h2>${[...N].sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<details class="nb"><summary>${bn(n.date)} — ${e(n.title)}</summary><pre>${e(n.body)}</pre>${admin?`<button class="b r" onclick="del('notices','${n.id}')">মুছুন</button>`:''}</details>`).join('')||'কোনো নোটিশ নেই'}</div>`+(admin?`<div class="c"><h2>নতুন নোটিশ</h2><input id="nt" placeholder="শিরোনাম"><textarea id="nbd" rows="4" placeholder="বিস্তারিত"></textarea><button class="b" onclick="addN()">প্রকাশ করুন</button></div>`:'');
if(k=='teachers')return `<div class="c"><h2>শিক্ষক-শিক্ষিকাদের তালিকা</h2><div class="tw"><table><tr><th>ক্রম</th><th>নাম</th><th>পদবী</th><th>যোগদান</th>${admin?'<th></th>':''}</tr>${(T.length?T:DEFT).map((t,i)=>`<tr><td>${bn(i+1)}</td><td>${e(t.name)}</td><td>${e(t.post)}</td><td>${e(t.join)}</td>${admin&&t.id?`<td><button class="b r" onclick="del('teachers','${t.id}')">মুছুন</button></td>`:''}</tr>`).join('')||'<tr><td colspan=4>তালিকা শিগগিরই যোগ করা হবে</td></tr>'}</table></div></div>`+(admin?`<div class="c">${T.length?'':'<p>উপরের তালিকা এখনো শুধু প্রদর্শনের জন্য।</p><button class="b" onclick="seedT()">এই তালিকা সংরক্ষণ করুন</button><hr>'}<h2>শিক্ষক যোগ করুন</h2><input id="tn" placeholder="নাম"><input id="tp" placeholder="পদবী (যেমন: সহকারী শিক্ষক)"><input id="tj" placeholder="যোগদানের তারিখ"><button class="b" onclick="addT()">যোগ করুন</button></div>`:'');
if(k=='students')return `<div class="c"><h2>ছাত্র-ছাত্রীদের তালিকা</h2>${U?`<div class="tw"><table><tr><th>শ্রেণি</th><th>রোল</th><th>নাম</th></tr>${S.filter(s=>s.status=='approved').sort((a,b)=>a.cls-b.cls||a.roll-b.roll).map(s=>`<tr><td>${CL[s.cls]}</td><td>${bn(s.roll)}</td><td>${e(s.name)}</td></tr>`).join('')||'<tr><td colspan=3>কেউ নেই</td></tr>'}</table></div>`:'শিক্ষার্থীদের তথ্য দেখতে <a href="portal.html">লগইন করুন</a>।'}</div>`;
if(['attendance','result','admit'].includes(k))return `<div class="c"><h2>${LBL[k]}</h2>এই তথ্য নিরাপত্তার জন্য লগইন করলে দেখা যায়। <a href="portal.html">পোর্টালে যান</a></div>`;
if(k=='admission')return `<div class="c"><h2>অনলাইন ভর্তি আবেদন</h2><input id="an" placeholder="শিক্ষার্থীর নাম"><input id="af" placeholder="পিতার নাম"><input id="am" placeholder="মাতার নাম"><input id="ap" placeholder="অভিভাবকের মোবাইল নম্বর"><label>জন্ম তারিখ</label><input id="ad" type="date"><label>যে শ্রেণিতে ভর্তি হতে চান</label><select id="ac" style="width:100%;padding:9px;margin:3px 0 8px">${CL.map((c,i)=>`<option value="${i}">${c}</option>`).join('')}</select><button class="b" onclick="applyAd()">আবেদন জমা দিন</button></div>`+(admin?`<div class="c"><h2>আবেদনসমূহ (${bn(AD.length)})</h2><div class="tw"><table><tr><th>নাম</th><th>পিতা</th><th>শ্রেণি</th><th>মোবাইল</th><th></th></tr>${AD.map(a=>`<tr><td>${e(a.name)}</td><td>${e(a.fa)}</td><td>${CL[a.cls]}</td><td>${e(a.ph)}</td><td><button class="b" onclick="admitS('${a.id}')">ভর্তি করুন</button> <button class="b r" onclick="del('admissions','${a.id}')">মুছুন</button></td></tr>`).join('')||'<tr><td colspan=5>কোনো আবেদন নেই</td></tr>'}</table></div></div>`:'');
if(k=='contact')return `<div class="c"><h2>যোগাযোগ</h2><p>${e(SC.addr)}${SC.phone?'<br>ফোন: '+e(SC.phone):''}${SC.email?'<br>ইমেইল: '+e(SC.email):''}</p><pre>${e(P.contact?.body||'')}</pre>${edit('contact')}</div>`;
return `<div class="c"><h2>${e(P[k]?.title||LBL[k]||'পাতা পাওয়া যায়নি')}</h2><pre>${e(P[k]?.body||DEF[k]||'এই পাতার তথ্য শিগগিরই যোগ করা হবে।')}</pre>${LBL[k]?edit(k):''}</div>`}
function render(){const k=(location.hash.slice(1)||'home');
$('#app').innerHTML=`<header${hs()}><img src="logo.png" alt="লোগো" style="width:84px;height:84px;border-radius:50%;background:#fff;margin-bottom:6px"><h1>${SC.bn}</h1><small>${SC.en}</small><small>${e(SC.addr)}</small></header><div class="bar"><button onclick="menu=!menu;render()">☰ মেনু</button><a href="#home" style="background:none;color:var(--pr)">হোম</a><a href="portal.html">${U?'পোর্টাল':'লগইন'}</a></div>
<div id="mn" class="${menu?'on':''}">${M.map(g=>`<details><summary>${g[0]}</summary>${g[1].map(i=>`<a href="#${i[0]}">${i[1]}</a>`).join('')}</details>`).join('')}</div>
<main>${msg?`<div class="c">${e(msg)}</div>`:''}${k=='home'?home():page(k)}</main><footer>© ${SC.bn}</footer>`}
const go=()=>{menu=false;msg='';render();scrollTo(0,0)};addEventListener('hashchange',go);window.render=render;
window.savePage=k=>setDoc(doc(db,'pages',k),{title:$('#pt').value,body:$('#pb').value}).then(()=>{msg='সংরক্ষিত হয়েছে।';render()}).catch(x=>{msg='ত্রুটি: '+x.code;render()});
window.addN=()=>{const t=$('#nt').value.trim();if(!t)return;addDoc(collection(db,'notices'),{title:t,body:$('#nbd').value,date:TD()}).catch(x=>{msg='ত্রুটি: '+x.code;render()})};
window.setSi=i=>{si=i;render()};window.tdy=()=>{cy=new Date().getFullYear();cm=new Date().getMonth();render()};
window.upPhoto=inp=>{const f=inp.files[0];if(!f)return;const im=new Image(),r=new FileReader();r.onload=()=>{im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);addDoc(collection(db,'photos'),{d:c.toDataURL('image/jpeg',.7),at:Date.now()}).then(()=>{msg='ছবি যোগ হয়েছে।';render()}).catch(x=>{msg='ত্রুটি: '+x.code;render()})};im.src=r.result};r.readAsDataURL(f)};
window.applyAd=()=>{const n=$('#an').value.trim(),p=$('#ap').value.trim();if(!n||!p){msg='নাম ও মোবাইল নম্বর দিন।';render();return}addDoc(collection(db,'admissions'),{name:n,fa:$('#af').value,mo:$('#am').value,ph:p,db:$('#ad').value,cls:+$('#ac').value,at:Date.now()}).then(()=>{msg='আবেদন জমা হয়েছে। স্কুল থেকে যোগাযোগ করা হবে।';render()}).catch(x=>{msg='ত্রুটি: '+x.code;render()})};
window.admitS=id=>{const a=AD.find(x=>x.id==id),r=prompt('রোল নম্বর দিন');if(!r)return;addDoc(collection(db,'students'),{name:a.name,fa:a.fa,mo:a.mo,ph:a.ph,cls:a.cls,roll:+r||0,db:a.db,status:'approved',by:U.email,at:Date.now()}).then(()=>deleteDoc(doc(db,'admissions',id))).catch(x=>{msg='ত্রুটি: '+x.code;render()})};
setInterval(()=>{const L=PHS();if(L.length>1&&['','home'].includes(location.hash.slice(1))&&$('#gm')){si=(si+1)%L.length;$('#gm').src=L[si].d}},5000);
window.seedT=()=>Promise.all(DEFT.map((t,i)=>addDoc(collection(db,'teachers'),{...t,at:Date.now()+i}))).then(()=>{msg='তালিকা সংরক্ষিত হয়েছে।';render()}).catch(x=>{msg='ত্রুটি: '+x.code;render()});
window.addT=()=>{const n=$('#tn').value.trim();if(!n)return;addDoc(collection(db,'teachers'),{name:n,post:$('#tp').value,join:$('#tj').value,at:Date.now()}).catch(x=>{msg='ত্রুটি: '+x.code;render()})};
window.del=(c,id)=>{if(confirm('মুছবেন?'))deleteDoc(doc(db,c,id)).catch(x=>{msg='ত্রুটি: '+x.code;render()})};
const live=(c,f)=>onSnapshot(collection(db,c),s=>{f(s);const au=$('audio');if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!(au&&!au.paused))render()},()=>{});
live('notices',s=>N=s.docs.map(d=>({id:d.id,...d.data()})));live('teachers',s=>T=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0)));
live('photos',s=>PH=s.docs.map(d=>({id:d.id,...d.data()})));live('pages',s=>{P={};s.docs.forEach(d=>P[d.id]=d.data())});
let us=null,ua=null;onAuthStateChanged(auth,async u=>{U=u;admin=false;us&&us();us=null;ua&&ua();ua=null;AD=[];
if(u){try{const d=await getDoc(doc(db,'users',u.uid));admin=d.exists()&&String(d.data().role||'').toLowerCase()=='admin'}catch(x){}
if(admin)ua=onSnapshot(collection(db,'admissions'),s=>{AD=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});us=onSnapshot(collection(db,'students'),s=>{S=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{})}render()});
render();
</script></body></html>
